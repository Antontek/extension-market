# 打包擴充商店：照 registry.json 抓每個擴充的新 tag，檢查通過就上架，結果推到 index 分支（網站讀那裡）。
# 每小時一次；登記清單、工具、打包程式改了（合併進 main）也會馬上跑；也可以在 Actions 頁手動執行
name: 打包擴充商店
on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths: [registry.json, 'tools/**', 'scripts/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-index
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci --prefix tools --no-audit --no-fund
      - name: 讀目前的 index 分支
        run: |
          if git fetch --depth 1 origin index; then git worktree add --detach previous FETCH_HEAD; else mkdir previous; fi
      - id: build
        run: node scripts/build-index.mjs --previous previous --out out
      # index 分支每次整個換掉、只留一個 commit：放很多版本的 zip，git 歷史也不會越來越大
      - name: 推到 index 分支
        if: steps.build.outputs.changed == 'true'
        working-directory: out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b index
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "擴充商店 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" index
